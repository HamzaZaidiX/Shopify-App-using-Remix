client_id = "58ccecad182ccd2183b6e7c8111c3958"
application_url = "https://republicans-ru-navy-cork.trycloudflare.com"
embedded = true
name = "shjz-dev-store"
handle = "shjz-dev-store"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://republicans-ru-navy-cork.trycloudflare.com/auth/callback",
  "https://republicans-ru-navy-cork.trycloudflare.com/auth/shopify/callback",
  "https://republicans-ru-navy-cork.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false
